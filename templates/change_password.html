{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <!-- Breadcrumbs -->
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}" class="text-decoration-none">Dashboard</a></li>
          <li class="breadcrumb-item"><a href="{{ url_for('profile') }}" class="text-decoration-none">Profile</a></li>
          <li class="breadcrumb-item active" aria-current="page">Change Password</li>
        </ol>
      </nav>

      <div class="app-card">
        <div class="p-4 p-md-5">
          
          <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div class="stat-icon amber" style="width: 48px; height: 48px; font-size: 1.3rem;">
              <i class="bi bi-shield-lock"></i>
            </div>
            <div>
              <h2 class="h4 fw-bold mb-0">Change Password</h2>
              <p class="text-muted small mb-0">Keep your community lending account secure.</p>
            </div>
          </div>

          <form method="POST" action="{{ url_for('change_password') }}">
            
            <!-- Current Password -->
            <div class="mb-3">
              <label for="current_password" class="form-label">
                <i class="bi bi-lock text-primary"></i> Current Password <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter your current password" required autofocus>
                <button class="btn btn-light toggle-password-btn" type="button" data-target="current_password" title="Toggle visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
              <label for="new_password" class="form-label">
                <i class="bi bi-shield-check text-primary"></i> New Password <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="At least 6 characters" required>
                <button class="btn btn-light toggle-password-btn" type="button" data-target="new_password" title="Toggle visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="form-text">Must be at least 6 characters long.</div>
            </div>

            <!-- Confirm New Password -->
            <div class="mb-4">
              <label for="confirm_password" class="form-label">
                <i class="bi bi-check2-all text-primary"></i> Confirm New Password <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
                <button class="btn btn-light toggle-password-btn" type="button" data-target="confirm_password" title="Toggle visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2 pt-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-shield-check me-1"></i> Update Password
              </button>
              <a href="{{ url_for('profile') }}" class="btn btn-light px-4">
                Cancel
              </a>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
